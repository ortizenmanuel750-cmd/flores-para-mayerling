data:text/html,<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Para Mayerling</title><style>body{background:#000;color:#FFD700;text-align:center;padding-top:80px;font-family:Arial}#sol{width:150px;height:150px;background:radial-gradient(circle,#FFD700,#FFA500);border-radius:50%;margin:30px auto;animation:giro 10s linear infinite;box-shadow:0 0 60px #FFD700}@keyframes giro{to{transform:rotate(360deg)}}button{padding:15px 30px;background:#FFD700;border:none;border-radius:25px;font-weight:bold}</style></head><body><h1>Para Mayerling 💛</h1><p>Eres la flor más hermosa</p><div id="sol"></div><button onclick="alert('No pude darte un ramo real, pero al menos quise hacerte este pequeño detalle para ti. Ten lindo día bonita 💛')">Toca el girasol 🌻</button></body></html>
