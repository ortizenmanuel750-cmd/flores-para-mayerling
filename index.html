<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayerling 🌻</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .inicio {
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #ccc;
    }

    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #f5c542;
      color: #111;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="inicio">
    <h1>Mayerling 🌻</h1>
    <p>Una pequeña sorpresa para ti</p>
    <button onclick="sorpresa()">Toca para iniciar</button>
  </div>

  <script>
    function sorpresa() {
      alert("🌻 Bienvenida, Mayerling 🌻");
    }
  </script>

</body>
</html>
