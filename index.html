  <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mayerling 💛</title>
<style>
    body { margin: 0; background: radial-gradient(ellipse at center, #332200 0%, #000 100%); overflow: hidden; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #texto { position: absolute; top: 8%; width: 100%; text-align: center; z-index: 10; color: #FFE55C; font-family: Arial; pointer-events: none; text-shadow: 0 0 30px #FFD966; }
    #texto h1 { font-size: 3em; margin: 0; animation: brillo 2.5s infinite; }
    #texto p { font-size: 1.3em; margin: 8px; }
    @keyframes brillo { 0%,100%{text-shadow:0 0 20px #FFD966} 50%{text-shadow:0 0 60px #FFE55C} }
    #mensaje { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px 40px; border-radius: 25px; color: #FFE55C; font-family: Arial; font-size: 1.3em; text-align: center; border: 3px solid #FFD966; box-shadow: 0 0 50px #FFD966; opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 20; max-width: 85%; }
    #mensaje.show { opacity: 1; }
    #hint { position: absolute; bottom: 15px; width: 100%; text-align: center; color: #FFF2B5; font-size: 0.9em; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
    <div id="texto">
        <h1>Para Mayerling 💛</h1>
        <p>Eres bonita</p>
        <p>Tú eres la flor más hermosa</p>
    </div>
    <div id="mensaje"></div>
    <div id="hint">Toca y arrastra para girar ✨ Toca un ramo para un mensaje</div>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000); const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement); camera.position.set(0, 20, 35);
scene.add(new THREE.AmbientLight(0xffffff, 1.2)); const solLuz = new THREE.PointLight(0xFFE55C, 3, 100); scene.add(solLuz);
const solGeo = new THREE.SphereGeometry(4, 32, 32); const solMat = new THREE.MeshBasicMaterial({color: 0xFFE55C}); const sol = new THREE.Mesh(solGeo, solMat);
scene.add(sol); solLuz.position.copy(sol.position);
function crearRamoGirasoles() { const ramo = new THREE.Group(); for(let i=0; i<5; i++){ const girasol = new THREE.Group();
const talloGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5); const talloMat = new THREE.MeshBasicMaterial({color: 0x228B22}); const tallo = new THREE.Mesh(talloGeo, talloMat); tallo.position.y = -0.75; girasol.add(tallo);
const centroGeo = new THREE.SphereGeometry(0.3, 16, 16); const centroMat = new THREE.MeshBasicMaterial({color: 0xFF8C42}); const centro = new THREE.Mesh(centroGeo, centroMat); girasol.add(centro);
const petaloGeo = new THREE.SphereGeometry(0.25, 8, 8); const petaloMat = new THREE.MeshBasicMaterial({color: 0xFFE55C}); for(let j=0; j<12; j++){ const ang = (j/12) * Math.PI * 2; const petalo = new THREE.Mesh(petaloGeo, petaloMat); petalo.position.set(Math.cos(ang)*0.5, Math.sin(ang)*0.5, 0); girasol.add(petalo); }
girasol.position.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5); ramo.add(girasol); }
const lazoGeo = new THREE.TorusGeometry(0.4, 0.08, 8, 16); const lazoMat = new THREE.MeshBasicMaterial({color: 0xFF69B4}); const lazo = new THREE.Mesh(lazoGeo, lazoMat); lazo.position.y = -1.2; lazo.rotation.x = Math.PI/2; ramo.add(lazo); return ramo; }
const ramos = []; const mensajes = [ "No pude darte un ramo real, pero al menos quise hacerte este pequeño detalle para ti. Ten lindo día bonita 💛", "Si cada girasol fuera un te quiero, te llenaría todo el universo. Eres especial Mayerling ✨", "Tu sonrisa ilumina más que este sol. Gracias por existir 🌻", "Eres mi girasol favorito. Siempre mirando hacia lo bonito, como tú.", "Por si hoy se te olvida: eres importante, eres bonita, y te mereces todo lo bueno." ];
for(let i=0; i<16; i++){ const ramo = crearRamoGirasoles(); const radio = 10 + (i % 4) * 3; const angulo = (i / 16) * Math.PI * 2; ramo.userData = { radio, angulo, velocidad: 0.003 + Math.random()*0.002 }; scene.add(ramo); ramos.push(ramo); }
let isDragging = false; let lastX = 0, lastY = 0; let rotX = 0, rotY = 0; function onMove(x, y){ if(!isDragging) return; rotY += (x - lastX) * 0.005; rotX += (y - lastY) * 0.005; lastX = x; lastY = y; }
document.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; }); document.addEventListener('mouseup', () => isDragging = false); document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
document.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }); document.addEventListener('touchend', () => isDragging = false); document.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY));
const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2(); const mensajeDiv = document.getElementById('mensaje'); function mostrarMensaje(event) {
const x = event.clientX || event.touches[0].clientX; const y = event.clientY || event.touches[0].clientY; mouse.x = (x / innerWidth) * 2 - 1; mouse.y = -(y / innerHeight) * 2 + 1; raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(ramos, true);
if(intersects.length > 0) { const msg = mensajes[Math.floor(Math.random()*mensajes.length)]; mensajeDiv.innerText = msg; mensajeDiv.classList.add('show'); setTimeout(() => mensajeDiv.classList.remove('show'), 4500); }
document.addEventListener('click', mostrarMensaje); document.addEventListener('touchstart', mostrarMensaje);
function animate() { requestAnimationFrame(animate); sol.rotation.y += 0.004; ramos.forEach(ramo => { ramo.userData.angulo += ramo.userData.velocidad; ramo.position.x = Math.cos(ramo.userData.angulo) * ramo.userData.radio; ramo.position.z = Math.sin(ramo.userData.angulo) * ramo.userData.radio; ramo.position.y = Math.sin(ramo.userData.angulo * 2) * 1; ramo.rotation.y += 0.01; });
scene.rotation.x = rotX; scene.rotation.y = rotY; renderer.render(scene, camera); } animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
