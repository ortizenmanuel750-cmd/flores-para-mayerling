<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mayerling 💛</title>
<style>
    body { 
        margin: 0; 
        background: radial-gradient(circle at center, #332200 0%, #000 100%); 
        overflow: hidden; 
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #contenedor { text-align: center; position: relative; }
    #titulo { color: #FFE55C; font-size: 3em; text-shadow: 0 0 30px #FFD966; animation: brillo 2.5s infinite; margin: 0; }
    #sub { color: #FFF2B5; font-size: 1.3em; margin: 10px; }
    @keyframes brillo { 0%,100%{text-shadow:0 0 20px #FFD966} 50%{text-shadow:0 0 60px #FFE55C} }
    
    #sol {
        width: 120px; height: 120px;
        background: radial-gradient(circle, #FFE55C 0%, #FFD700 100%);
        border-radius: 50%;
        margin: 30px auto;
        box-shadow: 0 0 60px #FFE55C;
        animation: girar 20s linear infinite;
        position: relative;
    }
    @keyframes girar { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
